## debfed CI/CD - one workflow, all gates.
##
## Runs on every push and PR. On a v* tag it ALSO builds, verifies and
## publishes the RPM -- but only after every gate below has passed, via
## `needs: gate` on the build job. A tag cannot ship an artifact that
## skipped the checks.
##
## Action versions: Node 20 was removed from GitHub runners on 2026-09-16,
## so checkout/setup-python/upload-artifact are pinned to the Node 24
## majors (v6/v6/v7). Do not downgrade these to v4/v5.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly disclosed CVE surfaces without a push.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_COLOR: "1"
  FEDORA_IMAGE: "fedora:latest"

jobs:

  # ------------------------------------------------------------------
  # 1. Code quality. Cheap and fast, so it runs unblocked.
  # ------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install ruff mypy types-PyYAML

      - name: Ruff (annotates inline on the diff)
        run: ruff check --output-format=github src/ tests/

      - name: Mypy
        id: mypy
        run: mypy src/debfed --ignore-missing-imports --no-strict-optional

      - name: Publish lint results to job summary
        if: always()
        run: |
          {
            echo "### Code quality"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| ruff | ${{ job.status }} |"
            echo "| mypy | ${{ steps.mypy.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 2. Static analysis. Needs security-events:write for the SARIF upload,
  #    granted at job level so the rest of the workflow stays read-only.
  # ------------------------------------------------------------------
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      FAIL_ON_MEDIUM: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          pip install 'bandit[sarif]'

      - name: Run bandit
        run: bandit -r src/ -f json -o bandit.json --exit-zero

      - name: Annotate and gate on findings
        run: |
          # Fail closed: without jq the counts would default to 0 and the
          # gate would silently pass. A security gate must never do that.
          command -v jq >/dev/null || { echo "::error title=gate::jq is missing"; exit 1; }
          test -s bandit.json || { echo "::error title=gate::bandit produced no report"; exit 1; }

          HIGH=$(jq '[.results[]? | select(.issue_severity=="HIGH")] | length' bandit.json)
          MED=$(jq  '[.results[]? | select(.issue_severity=="MEDIUM")] | length' bandit.json)
          LOW=$(jq  '[.results[]? | select(.issue_severity=="LOW")] | length' bandit.json)
          HIGH=${HIGH:-0}; MED=${MED:-0}; LOW=${LOW:-0}

          jq -r '.results[] | select(.issue_severity=="HIGH")
            | "::error title=\(.test_id)::\(.filename):\(.line_number) - \(.issue_text)"' \
            bandit.json | head -n 20
          jq -r '.results[] | select(.issue_severity=="MEDIUM")
            | "::warning title=\(.test_id)::\(.filename):\(.line_number) - \(.issue_text)"' \
            bandit.json | head -n 20

          {
            echo "### Static analysis: $HIGH high, $MED medium, $LOW low"
            echo
            echo "| Severity | Test | File | Line | Issue |"
            echo "|---|---|---|---|---|"
            jq -r '.results[] | select(.issue_severity=="HIGH" or .issue_severity=="MEDIUM")
              | "| \(.issue_severity) | \(.test_id) | \(.filename) | \(.line_number) | \(.issue_text) |"' \
              bandit.json
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$HIGH" -gt 0 ]; then
            echo "Blocking: $HIGH high-severity findings."; exit 1
          fi
          if [ "$FAIL_ON_MEDIUM" = "true" ] && [ "$MED" -gt 0 ]; then
            echo "Blocking: $MED medium-severity findings."; exit 1
          fi
          echo "Gate passed: $HIGH high, $MED medium."

      - name: Re-scan as SARIF for the Security tab
        if: always()
        run: bandit -r src/ -f sarif -o bandit.sarif --exit-zero

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ------------------------------------------------------------------
  # 3. GitHub's own semantic analysis. Results land in Security tab.
  # ------------------------------------------------------------------
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  # ------------------------------------------------------------------
  # 4. Dependency CVEs. Audits the DECLARED dependency set, not the whole
  #    environment: pip-audit --strict treats "not on PyPI" as a failure
  #    and debfed itself is unpublished.
  # ------------------------------------------------------------------
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          pip install pip-audit

      - name: Extract declared dependencies
        run: |
          python - <<'PY' > requirements-audit.txt
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          deps = data["project"].get("dependencies", [])
          deps += data["project"].get("optional-dependencies", {}).get("dev", [])
          print("\n".join(deps))
          PY
          cat requirements-audit.txt

      - name: Run pip-audit
        run: pip-audit --strict --format json -r requirements-audit.txt -o audit.json || true

      - name: Annotate and gate on findings
        run: |
          command -v jq >/dev/null || { echo "::error title=gate::jq is missing"; exit 1; }
          test -s audit.json || { echo "::error title=gate::pip-audit produced no report"; exit 1; }

          COUNT=$(jq '[.dependencies[]? | select((.vulns | length) > 0)] | length' audit.json)
          COUNT=${COUNT:-0}

          jq -r '.dependencies[]? | select((.vulns|length)>0) as $d | $d.vulns[]
            | "::error title=\(.id)::\($d.name) \($d.version) - fixed in \(.fix_versions[0] // "no fix available")"' \
            audit.json | head -n 20

          {
            echo "### Dependency audit: $COUNT vulnerable package(s)"
            echo
            if [ "$COUNT" -gt 0 ]; then
              echo "| Package | Installed | Advisory | Fixed in |"
              echo "|---|---|---|---|"
              jq -r '.dependencies[]? | select((.vulns|length)>0) as $d | $d.vulns[]
                | "| \($d.name) | \($d.version) | \(.id) | \(.fix_versions[0] // "unfixed") |"' \
                audit.json
            else
              echo "No known vulnerabilities in declared dependencies."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$COUNT" -gt 0 ]; then
            echo "Blocking: $COUNT vulnerable dependencies."; exit 1
          fi
          echo "Gate passed: no known CVEs."

  # ------------------------------------------------------------------
  # 5. Secret scan over full history.
  # ------------------------------------------------------------------
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # gitleaks needs full history
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ------------------------------------------------------------------
  # 6. Unit tests on two Fedora releases. rpmdeps behaviour is the whole
  #    premise of this tool, so it is tested against more than one rpm.
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [ 'fedora:latest', 'fedora:43' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            python3 python3-pip python3-pyyaml python3-pytest \
            rpm-build patchelf zstd findutils tar jq

      - name: Install debfed
        run: python3 -m pip install -e .

      - name: Run unit tests
        run: python3 -m pytest tests/ -v --tb=short

      - name: Publish test results to job summary
        if: always()
        run: |
          {
            echo "### Tests (${{ matrix.image }})"
            echo '```'
            python3 -m pytest tests/ -q --tb=no 2>&1 | tail -n 5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 7. THE security gate. Live exploits against the real CLI, not mocked
  #    unit tests. Every case here achieved code execution or an
  #    out-of-tree write against an earlier revision of this code.
  # ------------------------------------------------------------------
  exploit-suite:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            python3 python3-pip python3-pyyaml python3-pytest \
            rpm-build zstd findutils

      - name: Install debfed
        run: python3 -m pip install -e .

      - name: Run exploit suite
        run: |
          # pipefail is essential here: without it the exit status comes
          # from tee, so a failing exploit suite reports success. This
          # masked a real failure on the first run.
          set -o pipefail
          python3 tests/attack_suite.py 2>&1 | tee exploit.log

      - name: Run security regression tests
        run: |
          python3 -m pytest tests/ -v -k \
            "injection or traversal or escape or refused or hostile or setuid or symlink or truncated or implausible"

      - name: Publish exploit results to job summary
        if: always()
        run: |
          {
            echo "### Exploit suite"
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' exploit.log || echo "suite produced no output"
            echo '```'
            echo
            echo "Each case reproduced against an earlier revision. See SECURITY.md."
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 8. Does the output actually work? Converts a real Debian package and
  #    asserts the specific failure modes debfed exists to avoid.
  # ------------------------------------------------------------------
  package-integrity:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            python3 python3-pip python3-pyyaml rpm-build rpmlint \
            zstd findutils curl file

      - name: Install debfed
        run: python3 -m pip install -e .

      - name: Fetch a real Debian package
        run: |
          set -o pipefail
          # `tree` is the subject because its only dependency is glibc.
          # `jq` is NOT usable: the converted package requires libjq.so.1,
          # whose only Fedora provider is Fedora's own `jq`, which conflicts
          # by name -- an unsatisfiable loop that says nothing about whether
          # debfed works.
          #
          # Resolve the current pool filename rather than pinning a version:
          # Ubuntu drops superseded builds and a pinned URL eventually 404s.
          BASE=http://archive.ubuntu.com/ubuntu/pool/universe/t/tree/
          FILE=$(curl -sSf "$BASE" \
            | grep -o 'tree_[^"]*_amd64\.deb' | sort -u | tail -n1)
          # An empty result would make curl save the directory listing as the
          # .deb, failing confusingly three steps later.
          test -n "$FILE" || { echo "::error::could not resolve a tree .deb"; exit 1; }
          echo "resolved: $FILE"
          curl -sSfLo /tmp/test.deb "$BASE$FILE"
          file /tmp/test.deb | grep -q 'Debian binary package' \
            || { echo "::error::downloaded file is not a .deb"; exit 1; }
          ls -la /tmp/test.deb

      - name: Convert it
        run: |
          debfed inspect /tmp/test.deb
          debfed build /tmp/test.deb -o /tmp/out

      - name: Gate on RPM correctness
        run: |
          FAILED=0
          RPM=$(ls /tmp/out/*.rpm)

          # (a) claiming a filesystem-owned directory is exactly what makes
          #     alien output refuse to install
          for d in /usr /usr/bin /usr/lib64 /usr/share /usr/share/man/man1; do
            if rpm -qpl "$RPM" | grep -qx "$d"; then
              echo "::error title=shared-directory::RPM claims $d, owned by filesystem"
              FAILED=1
            fi
          done

          # (b) dependencies must come from SONAMEs, not Debian package names
          if ! rpm -qp --requires "$RPM" | grep -q 'libc\.so\.6'; then
            echo "::error title=no-soname-requires::dependency generator produced nothing"
            FAILED=1
          fi

          # (c) a bundled library must not advertise itself system-wide
          if rpm -qp --provides "$RPM" | grep -q '^lib.*\.so'; then
            echo "::error title=provides-leak::RPM leaks a bundled library provide"
            FAILED=1
          fi

          REQS=$(rpm -qp --requires "$RPM" | grep -c '\.so' || echo 0)
          LEAK=$(rpm -qp --provides "$RPM" | grep -c '\.so' || echo 0)

          {
            echo "### Package integrity"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Filesystem-owned dirs claimed | $([ "$FAILED" -eq 0 ] && echo none || echo SEE-LOG) |"
            echo "| SONAME requires generated | $REQS |"
            echo "| Bundled provides leaked | $LEAK |"
            echo
            echo "<details><summary>Generated requires</summary>"
            echo
            echo '```'
            rpm -qp --requires "$RPM"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $FAILED

      - name: Lint the generated package
        run: rpmlint /tmp/out/*.rpm || true

      - name: Verify install and removal
        run: |
          dnf install -y /tmp/out/*.rpm
          test -x /usr/bin/tree
          rpm -q tree
          /usr/bin/tree --version
          dnf remove -y tree
          test ! -e /usr/bin/tree || { echo "::error::removal left files behind"; exit 1; }
          echo "install/remove clean"

      - name: Verify the refusal engine
        run: |
          set -o pipefail
          BASE=http://archive.ubuntu.com/ubuntu/pool/main/g/glibc/
          FILE=$(curl -sSf "$BASE" \
            | grep -o 'libc6_[^"]*_amd64\.deb' | sort -u | tail -n1)
          test -n "$FILE" || { echo "::error::could not resolve a libc6 .deb"; exit 1; }
          echo "resolved: $FILE"
          curl -sSfLo /tmp/libc.deb "$BASE$FILE"
          if debfed inspect /tmp/libc.deb; then
            echo "::error title=refusal-engine::libc6 was NOT refused"
            exit 1
          fi
          echo "Refusal engine: libc6 correctly refused." >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 8b. Corpus. Every serious bug in this project was found by running a
  #     diverse sample and looking at the distribution of outcomes, not by
  #     testing one application. Foreign-architecture binaries, the
  #     inverted glibc check and directory ownership were all invisible
  #     from a single package.
  # ------------------------------------------------------------------
  corpus:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            python3 python3-pip python3-pyyaml rpm-build patchelf \
            zstd findutils curl jq

      - name: Install debfed
        run: python3 -m pip install -e .

      - name: Fetch corpus
        run: python3 tests/corpus.py fetch

      - name: Measure verdicts
        run: python3 tests/corpus.py measure | tee corpus.log

      - name: Install and execute every converted package
        run: python3 tests/corpus.py run | tee runtest.log

      - name: Gate on crashes and build failures
        run: |
          # A crash is always a bug. Refusals are not.
          if grep -qE '^  (CRASH|ERROR|build failed)' corpus.log runtest.log; then
            echo "::error title=corpus::debfed crashed or failed to build a package"
            exit 1
          fi
          echo "no crashes across the corpus"

      - name: Publish corpus results to job summary
        if: always()
        run: |
          {
            echo "### Corpus"
            echo '```'
            cat corpus.log
            echo '```'
            echo "### Execution"
            echo '```'
            cat runtest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 9. Single required status. Use this one job in branch protection, so
  #    adding a gate above never means editing repository settings.
  # ------------------------------------------------------------------
  gate:
    name: all checks passed
    runs-on: ubuntu-latest
    needs: [ lint, sast, codeql, dependency-audit, secrets, test, exploit-suite, package-integrity, corpus ]
    if: always()
    steps:
      - name: Verify every gate succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          FAILED=0
          for r in $RESULTS; do
            [ "$r" = "success" ] || FAILED=1
          done

          {
            echo "### Gate"
            echo
            if [ "$FAILED" -eq 0 ]; then
              echo "All checks passed. Release may proceed."
            else
              echo "One or more checks failed. Release is blocked."
              echo
              echo '```'
              echo "$RESULTS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error title=gate::a required check did not pass"
            exit 1
          fi
          echo "All gates green."

  # ------------------------------------------------------------------
  # 10. Tag only: build the RPM. `needs: gate` is the whole point -- a tag
  #     cannot produce an artifact that skipped the checks above.
  # ------------------------------------------------------------------
  build:
    name: build rpm
    needs: gate
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    container: fedora:latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install packaging tools
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build rpmdevtools rpmlint python3-devel python3-setuptools \
            python3-pip python3-pytest python3-pyyaml pyproject-rpm-macros \
            git tar zstd

      - name: Determine version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches the packaged version
        run: |
          SRC=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/debfed/__init__.py)
          if [ "$SRC" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::tag ${{ steps.ver.outputs.version }} does not match __version__ $SRC"
            exit 1
          fi

      - name: Build source tarball
        run: |
          V="${{ steps.ver.outputs.version }}"
          rpmdev-setuptree
          git config --global --add safe.directory "$PWD"
          git archive --format=tar.gz --prefix="debfed-$V/" \
            -o ~/rpmbuild/SOURCES/debfed-$V.tar.gz HEAD

      - name: Build RPM
        run: |
          V="${{ steps.ver.outputs.version }}"
          sed -i "s/^Version:.*/Version:        $V/" packaging/debfed.spec
          rpmbuild -bb packaging/debfed.spec
          mkdir -p dist
          find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} dist/ \;
          ls -la dist/

      - name: Lint the built RPM
        run: rpmlint dist/*.rpm || true

      - name: Verify the RPM installs and works
        run: |
          dnf install -y ./dist/*.rpm
          debfed --version
          debfed map get fonts-liberation | grep -q liberation-fonts

      - name: Re-run the exploit suite against the INSTALLED package
        run: cd /tmp && python3 "$GITHUB_WORKSPACE/tests/attack_suite.py"

      - name: Generate checksums
        run: cd dist && sha256sum *.rpm > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: dist/

  # ------------------------------------------------------------------
  # 11. Tag only: publish. The only job with write access.
  # ------------------------------------------------------------------
  publish:
    name: publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: rpm
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.rpm
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            Install:

            ```bash
            sudo dnf install https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/debfed-${{ needs.build.outputs.version }}-1.fc44.noarch.rpm
            ```

            Verify with `SHA256SUMS`.

            This build passed lint, static analysis, CodeQL, dependency
            audit, secret scan, the full test suite on two Fedora releases,
            the live exploit suite, and package-integrity checks before
            publishing. See SECURITY.md.
