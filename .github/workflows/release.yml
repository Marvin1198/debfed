## Tagged release.
##
## The `needs: checks` on the build job is the whole point: a tag cannot
## produce an RPM, and cannot publish a release, unless lint, type check,
## static analysis, dependency audit, secret scan, the full test suite,
## the live exploit suite and the package-integrity checks have all
## passed first.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ---- gate: nothing is built until every check is green -------------
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build:
    name: build rpm
    needs: checks
    runs-on: ubuntu-latest
    container: fedora:latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install packaging tools
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build rpmdevtools rpmlint python3-devel python3-setuptools \
            python3-pip python3-pytest python3-pyyaml pyproject-rpm-macros \
            git tar zstd

      - name: Determine version
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || V="0.0.0-dev"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches the packaged version
        if: github.ref_type == 'tag'
        run: |
          SRC=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/debfed/__init__.py)
          if [ "$SRC" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::tag ${{ steps.ver.outputs.version }} does not match __version__ $SRC"
            exit 1
          fi

      - name: Build source tarball
        run: |
          V="${{ steps.ver.outputs.version }}"
          rpmdev-setuptree
          git config --global --add safe.directory "$PWD"
          git archive --format=tar.gz --prefix="debfed-$V/" \
            -o ~/rpmbuild/SOURCES/debfed-$V.tar.gz HEAD

      - name: Build RPM
        run: |
          V="${{ steps.ver.outputs.version }}"
          sed -i "s/^Version:.*/Version:        $V/" packaging/debfed.spec
          rpmbuild -bb packaging/debfed.spec
          mkdir -p dist
          find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} dist/ \;
          ls -la dist/

      - name: Lint the built RPM
        run: rpmlint dist/*.rpm || true

      - name: Verify the RPM installs and works
        run: |
          dnf install -y ./dist/*.rpm
          debfed --version
          debfed map list | head -3
          # the shipped mapping data must actually be packaged
          debfed map get fonts-liberation | grep -q liberation-fonts

      - name: Re-run the exploit suite against the INSTALLED package
        run: |
          # Not the working tree: the artifact that users will download.
          cd /tmp && python3 "$GITHUB_WORKSPACE/tests/attack_suite.py"

      - name: Generate checksums
        run: |
          cd dist && sha256sum *.rpm > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: dist/

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: rpm
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.rpm
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            Install:

            ```bash
            sudo dnf install https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/debfed-${{ needs.build.outputs.version }}-1.fc44.noarch.rpm
            ```

            Verify with `SHA256SUMS`.

            This build passed lint, type check, bandit static analysis,
            dependency audit, secret scan, the full test suite, the live
            exploit suite, and package-integrity checks before publishing.
            See SECURITY.md.
