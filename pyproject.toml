[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debfed"
version = "0.1.0"
description = "Install Debian-targeted applications on Fedora as native RPMs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["fedora", "debian", "deb", "rpm", "packaging"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Software Distribution",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/Marvin1198/debfed"
Issues = "https://github.com/Marvin1198/debfed/issues"

[project.scripts]
debfed = "debfed.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
debfed = ["data/*.yaml"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
